# PR 검증 워크플로우
#
# PR 생성/업데이트 시 자동으로 실행되어 코드 품질을 검증합니다.
# - 린트 검사
# - 타입 체크
# - 빌드 검증
# - 패턴 검증
# - access verification pack

name: PR Validation

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production Dependency Audit
        run: pnpm security:audit

      - name: Verify Sharp Native Runtime
        run: pnpm security:sharp-runtime

      - name: Codex Sync Verify
        run: pnpm run codex:verify-sync

      - name: Codex Preflight
        run: pnpm run codex:preflight

      - name: DMS Launch Contract
        run: pnpm run verify:dms-launch-contract

      - name: CRM Go-Live Contract Self-Test
        run: pnpm run verify:crm-go-live:self-test

      - name: CRM Final Browser Evidence Contract Self-Test
        run: pnpm run verify:crm-go-live:final:self-test

      - name: CRM Worktree Evidence Identity Self-Test
        run: pnpm run verify:crm-worktree-identity:self-test

      - name: CRM UIUX Evidence Contract Self-Test
        run: pnpm run verify:crm-uiux-parity:self-test

      - name: CRM Current Demo Strict Gate Self-Test
        run: pnpm run verify:crm-current-demo:self-test

      - name: DMS Launch Types
        run: pnpm run verify:dms-launch-types

      - name: Prisma Deepmerge Security Contract
        run: pnpm run verify:prisma-deepmerge-security

      - name: SSOO Frame Verify
        run: pnpm run verify:ssoo-frame -- --skip-runtime

      - name: Shared Error Routing Contract
        run: pnpm run verify:error-routing

      - name: Input Intent and Autofill Contract
        run: pnpm run verify:input-intent

      - name: Codex Push Guard
        run: pnpm run codex:push-guard

      - name: Lint
        run: pnpm lint

      - name: Verify Documentation
        run: pnpm docs:verify

      - name: Type Check (Server)
        run: pnpm --filter server exec tsc --noEmit

      - name: Type Check (CRM)
        run: pnpm --filter web-crm exec tsc --noEmit

      - name: Type Check (PMS)
        run: pnpm --filter web-pms exec tsc --noEmit

      - name: Type Check (SNS)
        run: pnpm --filter web-sns exec tsc --noEmit

      - name: Type Check (DMS)
        run: pnpm --filter web-dms exec tsc --noEmit

      - name: Type Check (Admin)
        run: pnpm --filter web-admin exec tsc --noEmit

      - name: Unit Tests (Server)
        run: pnpm --filter server test

      - name: Build Database Package
        run: pnpm --filter @ssoo/database build

      - name: Test Database Launch Contract
        run: pnpm db:contract:test

      - name: Build Types Package
        run: pnpm --filter @ssoo/types build

  access-verification:
    name: Access Verification
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://ssoo:ssoo_dev_pw@localhost:5432/ssoo_dev?schema=public
      PORT: 4000
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001,http://localhost:3002
      JWT_SECRET: github-actions-jwt-secret
      JWT_REFRESH_SECRET: github-actions-jwt-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      AUTH_SESSION_COOKIE_NAME: ssoo-session
      AUTH_SESSION_COOKIE_DOMAIN: ''
      AUTH_SESSION_COOKIE_SECURE: 'false'
      AUTH_SESSION_COOKIE_SAME_SITE: lax
      ACCESS_VERIFY_BASE_URL: http://127.0.0.1:4000/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run access verification pack
        shell: bash
        run: |
          cleanup() {
            status=$?

            if [[ "$status" -ne 0 ]]; then
              docker compose -f compose.yaml -f compose.local.yaml logs server || true
            fi

            trap - EXIT
            docker compose -f compose.yaml -f compose.local.yaml down --volumes --remove-orphans || true
            exit "$status"
          }
          trap cleanup EXIT

          docker compose -f compose.yaml -f compose.local.yaml down --volumes --remove-orphans || true
          docker compose -f compose.yaml -f compose.local.yaml up -d postgres

          until docker compose -f compose.yaml -f compose.local.yaml exec -T postgres pg_isready -U ssoo -d ssoo_dev >/dev/null 2>&1; do
            sleep 2
          done

          pnpm --filter @ssoo/database db:generate
          pnpm db:baseline:verify
          pnpm db:migrate:deploy
          pnpm db:migrate:status
          bash .codex/scripts/db-seed.sh
          pnpm --filter @ssoo/database exec ts-node --project tsconfig.json scripts/apply-triggers.ts
          pnpm db:runtime:verify

          docker compose -f compose.yaml -f compose.local.yaml up -d --build server

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4000/api/health >/dev/null; then
              break
            fi

            sleep 2
          done

          curl -fsS http://127.0.0.1:4000/api/health >/dev/null
          pnpm verify:openapi-contract -- --runtime-url=http://127.0.0.1:4000/api/openapi.json
          pnpm verify:access-ci

  # 변경 범위 분석
  analyze-changes:
    name: Analyze Changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      pms: ${{ steps.filter.outputs.pms }}
      dms: ${{ steps.filter.outputs.dms }}
      sns: ${{ steps.filter.outputs.sns }}
      database: ${{ steps.filter.outputs.database }}
      admin: ${{ steps.filter.outputs.admin }}
      crm: ${{ steps.filter.outputs.crm }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'apps/server/**'
            pms:
              - 'apps/web/pms/**'
            dms:
              - 'apps/web/dms/**'
            database:
              - 'packages/database/**'
            sns:
              - 'apps/web/sns/**'
            admin:
              - 'apps/web/admin/**'
            crm:
              - 'apps/web/crm/**'

  # 서버 빌드 (서버 변경 시에만)
  build-server:
    name: Build Server
    needs: [validate, analyze-changes]
    if: needs.analyze-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:server

  # CRM 빌드 (CRM 변경 시에만)
  build-crm:
    name: Build CRM
    needs: [validate, analyze-changes]
    if: needs.analyze-changes.outputs.crm == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:web-crm

  # PMS 빌드 (PMS 변경 시에만)
  build-pms:
    name: Build PMS
    needs: [validate, analyze-changes]
    if: needs.analyze-changes.outputs.pms == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:web-pms

  # DMS 빌드 (DMS 변경 시에만)
  build-dms:
    name: Build DMS
    needs: [validate, analyze-changes]
    if: needs.analyze-changes.outputs.dms == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:web-dms

  # SNS 빌드 (SNS 변경 시에만)
  build-sns:
    name: Build SNS
    needs: [validate, analyze-changes]
    if: needs.analyze-changes.outputs.sns == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:web-sns

  # Admin 빌드 (Admin 변경 시에만)
  build-admin:
    name: Build Admin
    needs: [validate, analyze-changes]
    if: needs.analyze-changes.outputs.admin == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:web-admin

  # PR 코멘트
  pr-comment:
    name: PR Summary
    needs: [validate, access-verification, analyze-changes, build-server, build-crm, build-pms, build-dms, build-sns, build-admin]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Post Summary
        uses: actions/github-script@v7
        with:
          script: |
            const validate = '${{ needs.validate.result }}';
            const accessVerification = '${{ needs.access-verification.result }}';
            const buildServer = '${{ needs.build-server.result }}';
            const buildCrm = '${{ needs.build-crm.result }}';
            const buildPms = '${{ needs.build-pms.result }}';
            const buildDms = '${{ needs.build-dms.result }}';
            const buildSns = '${{ needs.build-sns.result }}';
            const buildAdmin = '${{ needs.build-admin.result }}';
            const server = '${{ needs.analyze-changes.outputs.server }}';
            const crm = '${{ needs.analyze-changes.outputs.crm }}';
            const pms = '${{ needs.analyze-changes.outputs.pms }}';
            const dms = '${{ needs.analyze-changes.outputs.dms }}';
            const sns = '${{ needs.analyze-changes.outputs.sns }}';
            const admin = '${{ needs.analyze-changes.outputs.admin }}';
            const database = '${{ needs.analyze-changes.outputs.database }}';
            const formatResult = (result) => {
              if (result === 'success') return '✅';
              if (result === 'skipped') return '➖';
              return '❌';
            };
            const gatePassed = (result) => result === 'success' || result === 'skipped';
            const overallSuccess = [
              validate,
              accessVerification,
              buildServer,
              buildCrm,
              buildPms,
              buildDms,
              buildSns,
              buildAdmin,
            ].every(gatePassed);
            
            let body = '## 🔍 PR 검증 결과\n\n';
            
            if (overallSuccess) {
              body += '✅ **검증 통과**\n\n';
            } else {
              body += '❌ **검증 실패**\n\n';
            }

            body += '### 검증 게이트\n\n';
            body += `| 게이트 | 결과 |\n`;
            body += `|--------|------|\n`;
            body += `| Validate PR | ${formatResult(validate)} ${validate} |\n`;
            body += `| Access Verification | ${formatResult(accessVerification)} ${accessVerification} |\n`;
            body += `| Build Server | ${formatResult(buildServer)} ${buildServer} |\n`;
            body += `| Build CRM | ${formatResult(buildCrm)} ${buildCrm} |\n`;
            body += `| Build PMS | ${formatResult(buildPms)} ${buildPms} |\n`;
            body += `| Build DMS | ${formatResult(buildDms)} ${buildDms} |\n`;
            body += `| Build SNS | ${formatResult(buildSns)} ${buildSns} |\n`;
            body += `| Build Admin | ${formatResult(buildAdmin)} ${buildAdmin} |\n\n`;
            
            body += '### 변경 영역\n\n';
            body += `| 영역 | 변경 여부 |\n`;
            body += `|------|----------|\n`;
            body += `| Server | ${server === 'true' ? '✅' : '➖'} |\n`;
            body += `| CRM | ${crm === 'true' ? '✅' : '➖'} |\n`;
            body += `| PMS | ${pms === 'true' ? '✅' : '➖'} |\n`;
            body += `| DMS | ${dms === 'true' ? '✅' : '➖'} |\n`;
            body += `| SNS | ${sns === 'true' ? '✅' : '➖'} |\n`;
            body += `| Admin | ${admin === 'true' ? '✅' : '➖'} |\n`;
            body += `| Database | ${database === 'true' ? '✅' : '➖'} |\n`;
            
            // 기존 코멘트 찾기
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(c => 
              c.user.type === 'Bot' && c.body.includes('PR 검증 결과')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
