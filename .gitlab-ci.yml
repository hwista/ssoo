stages:
  - verify
  - ai_review
  - build
  - deploy

variables:
  APP_DIR: "/opt/ssoo/app"
  COMPOSE_PROJECT_NAME: "app"
  COMPOSE_FILE: "compose.yaml:compose.staging.yaml"
  POSTGRES_DATA_VOLUME: "app_ssoo-postgres-data"
  ADMIN_PORT: "3000"
  CRM_PORT: "3001"
  PMS_PORT: "3002"
  DMS_PORT: "3003"
  SNS_PORT: "3004"
  NEXT_PUBLIC_ADMIN_APP_URL: "http://10.125.12.170:3000"
  NEXT_PUBLIC_CRM_APP_URL: "http://10.125.12.170:3001"
  NEXT_PUBLIC_PMS_APP_URL: "http://10.125.12.170:3002"
  NEXT_PUBLIC_DMS_APP_URL: "http://10.125.12.170:3003"
  NEXT_PUBLIC_SNS_APP_URL: "http://10.125.12.170:3004"
  AUTH_DEFAULT_LOGIN_URL: "http://10.125.12.170:3000/login"
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"

verify:
  stage: verify
  tags:
    - ssoo
  script:
    - bash "$CI_PROJECT_DIR/scripts/ci/run-app-job.sh" verify
  only:
    - development

diagnose_runtime:
  stage: verify
  tags:
    - ssoo
  when: manual
  allow_failure: true
  script:
    - bash "$CI_PROJECT_DIR/scripts/ci/diagnose-runtime.sh"
  only:
    - development

ai_review:
  stage: ai_review
  tags:
    - ssoo
  script:
    - bash "$CI_PROJECT_DIR/scripts/ci/run-app-job.sh" ai-review
  artifacts:
    paths:
      - ai-review-report.md
    expire_in: 30 days
  allow_failure: true
  only:
    - development

build:
  stage: build
  tags:
    - ssoo
  script:
    - bash "$CI_PROJECT_DIR/scripts/ci/run-app-job.sh" build
  only:
    - development

deploy_dev:
  stage: deploy
  tags:
    - ssoo
  when: manual
  allow_failure: false
  environment:
    name: development
    url: http://10.125.12.170:3003
  script:
    - bash "$CI_PROJECT_DIR/scripts/ci/run-app-job.sh" deploy
  only:
    - development
