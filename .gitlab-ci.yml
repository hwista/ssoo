stages:
  - verify
  - ai_review
  - build
  - deploy
  - diagnose

variables:
  APP_DIR: "/opt/ssoo/app"
  COMPOSE_PROJECT_NAME: "app"
  COMPOSE_FILE: "compose.yaml:compose.staging.yaml"
  POSTGRES_DATA_VOLUME: "app_ssoo-postgres-data"
  ADMIN_PORT: "3000"
  CRM_PORT: "3001"
  PMS_PORT: "3002"
  DMS_PORT: "3003"
  SNS_PORT: "3004"
  NEXT_PUBLIC_ADMIN_APP_URL: "http://10.125.12.170:3000"
  NEXT_PUBLIC_CRM_APP_URL: "http://10.125.12.170:3001"
  NEXT_PUBLIC_PMS_APP_URL: "http://10.125.12.170:3002"
  NEXT_PUBLIC_DMS_APP_URL: "http://10.125.12.170:3003"
  NEXT_PUBLIC_SNS_APP_URL: "http://10.125.12.170:3004"
  AUTH_DEFAULT_LOGIN_URL: "http://10.125.12.170:3000/login"
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"

verify:
  stage: verify
  tags:
    - ssoo
  script:
    - bash "$CI_PROJECT_DIR/scripts/ci/run-app-job.sh" verify
  only:
    - development

ai_review:
  stage: ai_review
  tags:
    - ssoo
  script:
    - bash "$CI_PROJECT_DIR/scripts/ci/run-app-job.sh" ai-review
  artifacts:
    paths:
      - ai-review-report.md
    expire_in: 30 days
  # ai-review.sh reports AI/network/config problems and exits 0, so only real runner
  # failures (source sync, lock) fail this job.
  only:
    - development

build:
  stage: build
  tags:
    - ssoo
  script:
    - bash "$CI_PROJECT_DIR/scripts/ci/run-app-job.sh" build
  only:
    - development

deploy_dev:
  stage: deploy
  tags:
    - ssoo
  when: manual
  allow_failure: false
  environment:
    name: development
    url: http://10.125.12.170:3003
  script:
    - bash "$CI_PROJECT_DIR/scripts/ci/run-app-job.sh" deploy
  only:
    - development

# Runs automatically only when an earlier job failed, so successful pipelines show it as skipped.
# A failed deploy also captures the pre-rollback state inside deploy_dev; this job records the state after rollback.
diagnose_runtime:
  stage: diagnose
  tags:
    - ssoo
  when: on_failure
  script:
    - bash "$CI_PROJECT_DIR/scripts/ci/diagnose-runtime.sh"
  only:
    - development
