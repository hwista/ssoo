stages:
  - verify
  - plan
  - build
  - db_check
  - deploy
  - diagnose

variables:
  # staging: pre-deploy dump + compat db-init + health checks, without the isolated
  # rehearsal and smoke-token gates of the production "apply" path (not used on staging yet).
  CI_DEPLOY_MODE: "staging"
  CI_INCREMENTAL_BUILD: "false"
  APP_DIR: "/opt/ssoo/app"
  COMPOSE_PROJECT_NAME: "app"
  COMPOSE_FILE: "compose.yaml:compose.staging.yaml"
  POSTGRES_DATA_VOLUME: "app_ssoo-postgres-data"
  ADMIN_PORT: "3000"
  CRM_PORT: "3001"
  PMS_PORT: "3002"
  DMS_PORT: "3003"
  SNS_PORT: "3004"
  # These are build inputs: browser bundles must reach the staging API, not
  # the workstation's localhost. Runtime-only overrides cannot change them.
  ADMIN_NEXT_PUBLIC_API_URL: "http://10.125.12.170:4000/api"
  CRM_NEXT_PUBLIC_API_URL: "http://10.125.12.170:4000/api"
  PMS_NEXT_PUBLIC_API_URL: "http://10.125.12.170:4000/api"
  DMS_NEXT_PUBLIC_API_URL: "http://10.125.12.170:4000/api"
  SNS_NEXT_PUBLIC_API_URL: "http://10.125.12.170:4000/api"
  NEXT_PUBLIC_ADMIN_APP_URL: "http://10.125.12.170:3000"
  NEXT_PUBLIC_CRM_APP_URL: "http://10.125.12.170:3001"
  NEXT_PUBLIC_PMS_APP_URL: "http://10.125.12.170:3002"
  NEXT_PUBLIC_DMS_APP_URL: "http://10.125.12.170:3003"
  NEXT_PUBLIC_SNS_APP_URL: "http://10.125.12.170:3004"
  AUTH_DEFAULT_LOGIN_URL: "http://10.125.12.170:3000/login"
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"

verify:
  stage: verify
  tags:
    - ssoo
  script:
    - bash "$CI_PROJECT_DIR/scripts/ci/run-app-job.sh" verify
  only:
    - development

diagnose_runtime:
  stage: diagnose
  tags:
    - ssoo
  when: on_failure
  script:
    - bash "$CI_PROJECT_DIR/scripts/ci/diagnose-runtime.sh"
  only:
    - development

plan:
  stage: plan
  tags:
    - ssoo
  script:
    - bash "$CI_PROJECT_DIR/scripts/ci/run-app-job.sh" plan
  only:
    - development

build:
  stage: build
  tags:
    - ssoo
  script:
    - bash "$CI_PROJECT_DIR/scripts/ci/run-app-job.sh" build
  only:
    - development

# Runs db-init twice on a throwaway copy of the live staging database; the running stack is not
# touched. Review its result before pressing deploy_dev (the stop point before any runtime change).
db_check:
  stage: db_check
  tags:
    - ssoo
  script:
    - bash "$CI_PROJECT_DIR/scripts/ci/run-app-job.sh" db-check
  only:
    - development

deploy_dev:
  stage: deploy
  tags:
    - ssoo
  when: manual
  allow_failure: false
  environment:
    name: development
    url: http://10.125.12.170:3003
  script:
    - bash "$CI_PROJECT_DIR/scripts/ci/run-app-job.sh" deploy
  only:
    - development
